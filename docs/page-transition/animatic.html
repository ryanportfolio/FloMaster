<title>Page transition animatic: the tide, with the drop</title>
<!-- Animatic for docs/page-transition/BRIEF.md. Final timing, rough visuals.
     Every frame is a pure function of the timeline time T (ms): frame(T) draws the two page
     screenshots and the band on a canvas, then sets the header, bottom bar and logo SVG from T.
     Nothing integrates over frames, so seeking, pausing and slow motion all render the same pixels.
     URL options for capture: ?view=phone&pass=short&t=340&paused  (t is ms from transition start).
     window.__anim exposes seek, seekTransition, pause, play, set and frame timing for scripts. -->
<style>
:root{--navy-950:#0c1b30;--navy-900:#12253f;--navy:#1b3556;--navy-700:#24456d;--sky:#6aaed6;--sky-300:#a9d2ea;--sky-100:#e4f1f9;--slate:#5b7fae;--paper:#f6f8fb}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--navy-950);color:var(--paper);font:14px/1.4 system-ui,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;gap:10px;padding:12px 16px 14px}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.group{display:inline-flex;border:1px solid var(--navy-700);border-radius:8px;overflow:hidden}
.group button{border:0;border-radius:0;border-right:1px solid var(--navy-700)}
.group button:last-child{border-right:0}
button{font:inherit;color:var(--paper);background:var(--navy-900);border:1px solid var(--navy-700);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:36px}
button:hover{background:var(--navy)}
button[aria-pressed="true"]{background:var(--sky-300);color:var(--navy-950);font-weight:600}
button:focus-visible,#track:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#wrap{flex:1;min-height:0;display:grid;place-items:center}
#stage{position:relative;overflow:hidden;background:var(--navy-950);box-shadow:0 0 0 1px var(--navy-700)}
#cv{position:absolute;left:0;top:0;display:block}
#chrome{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
#hdr{position:absolute;left:0;top:0;background-repeat:no-repeat}
#logo{position:absolute;overflow:visible}
#bar{position:absolute;left:0;background-repeat:no-repeat;display:none}
.scrub{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:start}
#readout{font-variant-numeric:tabular-nums;min-width:9.5em;color:var(--sky-300);padding-top:3px}
#track{position:relative;height:56px;cursor:pointer;touch-action:none}
#rail{position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;background:var(--navy-700)}
#hold{position:absolute;left:0;top:9px;height:6px;border-radius:3px 0 0 3px;background:var(--navy)}
#fill{position:absolute;left:0;top:9px;height:6px;border-radius:3px;background:var(--sky)}
#head{position:absolute;top:2px;width:4px;height:20px;margin-left:-2px;border-radius:2px;background:var(--paper)}
.tick{position:absolute;top:4px;width:2px;height:16px;margin-left:-1px;background:var(--sky-300);opacity:.8}
.tlab{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--sky-300);white-space:nowrap;cursor:pointer;font-variant-numeric:tabular-nums}
.tlab.r0{top:24px}.tlab.r1{top:38px}
.tick.zero{background:var(--paper);height:20px;top:2px}
#beats{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:2px 18px;font-size:12.5px;color:#9fb3cc;grid-column:1/-1}
#beats div{padding:2px 6px;border-radius:4px;border-left:3px solid transparent}
#beats div.on{color:var(--paper);background:var(--navy-900);border-left-color:var(--sky)}
#beats b{font-weight:600;font-variant-numeric:tabular-nums;color:inherit}
.hint{font-size:12px;color:#9fb3cc}
</style>
</head>

<script>
'use strict';
// ---------- constants from BRIEF.md, pitch-tide.md and facts.md ----------
const C = { navy900:'#12253f', navy:'#1b3556', cardLine:'#213f66', sky300:'#a9d2ea', slate:'#5b7fae' };
const HOLD = 600, TAIL = 500;               // hold on the old page before t=0; settle time shown after the end
const LOGO_H = 28, LOGO_W = 28 * 673 / 99;  // header logo is 1.75rem tall
const VIEWS = {
  desktop: { W:1425, H:900, old:'animatic-assets/desktop-old.jpg', neu:'animatic-assets/desktop-new.jpg', logo:{ x:122.5, y:51 }, header:146, bar:null },
  // barOnOld: the old page (home) hides the bottom bar, so the new page's bar arrives with the new page
  phone:   { W:375,  H:667, old:'animatic-assets/phone-old.jpg',   neu:'animatic-assets/phone-new.jpg',   logo:{ x:20,    y:51 }, header:146, bar:{ y:599, h:68 }, barOnOld:false },
};
// Owner review 2026-10-05: every animated pass runs at half speed; the reduced-motion dissolve stays short.
const PASSES = {
  full: { dur:1040, ticks:[0,120,200,280,400,600,680,840,880,920,1040,1120,1280], beats:[
    [0,280,'The logo’s drop stretches and falls from the tap into the ring'],
    [0,1040,'Band travels from above the screen to below it, fully off screen by about 880; the new page is uncovered behind its center line'],
    [0,1040,'Foam and wet lines drift one wave period sideways'],
    [200,200,'Top 240 px of the new page visible below the header'],
    [680,680,'Whole screen visible; band leaving under the bottom bar'],
    [120,600,'Ring water rises to about half the ring'],
    [400,920,'One damped slosh inside the ring: -4°, +1.5°, 0°'],
    [840,1120,'The drop re-forms at the tap'],
    [920,1280,'Ring water drains'],
    [1040,1040,'Transition over; the page takes taps again'] ] },
  short: { dur:400, ticks:[0,240,360,400,640], beats:[
    [0,400,'Page dissolve, header and bar still'],
    [0,240,'Drop dips into the ring and re-forms'],
    [0,360,'Ring swell, a thin sliver along the bottom of the ring'],
    [360,640,'Swell drains'] ] },
  reduced: { dur:200, ticks:[0,200], beats:[
    [0,200,'Page dissolves old to new; header and bottom bar held still'],
    [0,200,'No band, no drop, no slosh'] ] },
};
const BAND_GONE = 880;   // the band's top crest crosses the bottom of the screen here
// ring water levels (logo SVG units; ring center y 65, clear inner radius about 39)
const S_REST = 108, S_FULL = 65, S_SWELL = 96;

// ---------- easing ----------
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, u) => a + (b - a) * u;
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = s => ((ax * s + bx) * s + cx) * s, Y = s => ((ay * s + by) * s + cy) * s, dX = s => (3 * ax * s + 2 * bx) * s + cx;
  return x => {
    x = clamp(x); if (x === 0 || x === 1) return x;
    let s = x;
    for (let i = 0; i < 8; i++) { const e = X(s) - x, d = dX(s); if (Math.abs(e) < 1e-7) return Y(s); if (Math.abs(d) < 1e-6) break; s -= e / d; }
    let lo = 0, hi = 1; s = x;
    for (let i = 0; i < 40; i++) { const v = X(s); if (Math.abs(v - x) < 1e-7) break; if (v < x) lo = s; else hi = s; s = (lo + hi) / 2; }
    return Y(s);
  };
}
// Band travel over 0..BAND_GONE: an ease-out whose speed settles to a steady 30% of the start speed
// instead of falling to zero, so the tail slides off the bottom rather than creeping along it.
// p(v) = 2.4v - 2.1v^2 + 0.7v^3, which is exactly cubic-bezier(1/3, 0.8, 2/3, 0.9) over 880 ms.
const easeTide = v => { v = clamp(v); return ((0.7 * v - 2.1) * v + 2.4) * v; };
const easeInOut = bezier(0.65, 0, 0.35, 1);
const easeCss = bezier(0.25, 0.1, 0.25, 1);    // browser default "ease", for the reduced-motion dissolve
const easeCssInOut = bezier(0.42, 0, 0.58, 1); // CSS ease-in-out, for the short pass dissolve
const outCubic = u => 1 - (1 - clamp(u)) ** 3;
const inCubic = u => clamp(u) ** 3;
const inQuad = u => clamp(u) ** 2;

// ---------- state ----------
const qs = new URLSearchParams(location.search);
let view = VIEWS[qs.get('view')] ? qs.get('view') : 'desktop';
let pass = PASSES[qs.get('pass')] ? qs.get('pass') : 'full';
let T = 0, playing = false, rate = 1, last = 0;
const total = () => HOLD + PASSES[pass].dur + TAIL;

// ---------- elements ----------
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d', { alpha: false }), stage = $('stage'), wrap = $('wrap'), chrome = $('chrome');
const hdr = $('hdr'), logo = $('logo'), bar = $('bar'), lw = $('lw'), lwTilt = $('lwTilt'), lwLevel = $('lwLevel');
const dropG = $('dropG'), dropClipRect = $('dropClipRect');
const readout = $('readout'), track = $('track'), fill = $('fill'), head = $('head'), holdEl = $('hold'), ticksEl = $('ticks'), beatsEl = $('beats');
const playBtn = $('play'), slowBtn = $('slow');

// ring surface: 26-unit wave, 2.5 units peak to peak, wide enough for one wave of drift and the tilt
(function buildRingWater() {
  const A = 1.25 / 0.75; let d = 'M50 0';
  for (let x = 50, n = 0; x < 300; x += 13, n++) { const s = n % 2 ? 1 : -1; d += ` C${x + 3.25} ${s * A} ${x + 9.75} ${s * A} ${x + 13} 0`; }
  $('lwSurf').setAttribute('d', d);
  $('lwBody').setAttribute('d', d + ' L310 70 L50 70 Z');
})();

// ---------- images ----------
const IMG = {};
function loadImg(src) { if (IMG[src]) return IMG[src].ready; const im = new Image(); im.src = src; const ready = im.decode().then(() => im); IMG[src] = { im, ready }; return ready; }
const ready = Promise.all(Object.values(VIEWS).flatMap(v => [loadImg(v.old), loadImg(v.neu)]));

// ---------- layout ----------
let scale = 1, k = 1;
let loaded = false;
function layout() {
  if (!loaded) return;
  const V = VIEWS[view], r = wrap.getBoundingClientRect();
  scale = Math.min(r.width / V.W, r.height / V.H);
  const w = Math.floor(V.W * scale), h = Math.floor(V.H * scale);
  scale = w / V.W;
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cv.style.width = w + 'px'; cv.style.height = h + 'px';
  k = cv.width / V.W;
  chrome.style.width = V.W + 'px'; chrome.style.height = V.H + 'px'; chrome.style.transform = `scale(${scale})`;
  hdr.style.width = V.W + 'px'; hdr.style.height = V.header + 'px'; hdr.style.backgroundSize = `${V.W}px ${V.H}px`;
  logo.style.left = V.logo.x + 'px'; logo.style.top = V.logo.y + 'px'; logo.style.width = LOGO_W + 'px'; logo.style.height = LOGO_H + 'px';
  if (V.bar) {
    bar.style.top = V.bar.y + 'px'; bar.style.height = V.bar.h + 'px'; bar.style.width = V.W + 'px';
    bar.style.backgroundImage = `url(${V.neu})`; bar.style.backgroundSize = `${V.W}px ${V.H}px`; bar.style.backgroundPosition = `0 ${-V.bar.y}px`;
  }
  hdrSrc = '';
  frame(T);
}

// ---------- the band ----------
// Card wave: half-period 48 px cubics with controls 12 and 36 px in, as in the --waves tile.
// A is the control offset; the curve's real amplitude is 0.75 * A.
function waveFwd(p, yc, A, ph, x0, x1, move) {
  let n = Math.floor((x0 - ph) / 48); const nEnd = Math.ceil((x1 - ph) / 48);
  const xs0 = ph + 48 * n; if (move) p.moveTo(xs0, yc); else p.lineTo(xs0, yc);
  for (; n < nEnd; n++) { const xs = ph + 48 * n, s = (n & 1) ? 1 : -1; p.bezierCurveTo(xs + 12, yc + s * A, xs + 36, yc + s * A, xs + 48, yc); }
}
function waveRev(p, yc, A, ph, x0, x1) {
  const nStart = Math.floor((x0 - ph) / 48); let n = Math.ceil((x1 - ph) / 48) - 1;
  p.lineTo(ph + 48 * (n + 1), yc);
  for (; n >= nStart; n--) { const xs = ph + 48 * n, s = (n & 1) ? 1 : -1; p.bezierCurveTo(xs + 36, yc + s * A, xs + 12, yc + s * A, xs, yc); }
}
function drawBand(Y, h, a, drift, W) {
  const yu = Y + a, yl = Y + a + h, A = a / 0.75, x0 = -100, x1 = W + 100;
  const body = new Path2D();
  waveFwd(body, yu, A, drift + 48, x0, x1, true);   // trailing edge, half a period out of step
  waveRev(body, yl, A, drift, x0, x1);              // leading edge
  body.closePath();
  ctx.fillStyle = C.navy900; ctx.fill(body);
  // the business card's wave tile, carried by the band and drifting with its edges, so it moves as one sheet
  ctx.save(); ctx.clip(body);
  ctx.strokeStyle = C.cardLine; ctx.lineWidth = 5;
  for (let y = Y + 12 - 24; y < yl + 24; y += 24) { const p = new Path2D(); waveFwd(p, y, 12, drift, x0, x1, true); ctx.stroke(p); }
  ctx.restore();
  // leading edge: a navy ribbon along the card's wave line, foam on its front
  const rib = new Path2D();
  waveFwd(rib, yl - 12, A, drift, x0, x1, true);
  waveRev(rib, yl, A, drift, x0, x1);
  rib.closePath();
  ctx.fillStyle = C.navy; ctx.fill(rib);
  const foam = new Path2D(); waveFwd(foam, yl, A, drift, x0, x1, true);
  ctx.strokeStyle = C.sky300; ctx.lineWidth = 2; ctx.stroke(foam);
  const wet = new Path2D(); waveFwd(wet, yu, A, drift + 48, x0, x1, true);
  ctx.strokeStyle = C.slate; ctx.lineWidth = 2; ctx.stroke(wet);
}

// ---------- the ring and the drop ----------
function ringLevel(t) {
  if (pass === 'full') {
    if (t < 120) return S_REST;
    if (t < 600) return lerp(S_REST, S_FULL, outCubic((t - 120) / 480));
    if (t < 920) return S_FULL;
    if (t < 1280) return lerp(S_FULL, S_REST, inCubic((t - 920) / 360));
    return S_REST;
  }
  if (pass === 'short') {
    if (t < 360) return lerp(S_REST, S_SWELL, outCubic(t / 360));
    if (t < 640) return lerp(S_SWELL, S_REST, inCubic((t - 360) / 280));
  }
  return S_REST;
}
function ringTilt(t) {
  if (pass !== 'full' || t <= 400 || t >= 920) return 0;
  const keys = [0, -4, 1.5, 0], u = (t - 400) / 520 * 3, i = Math.min(2, Math.floor(u));
  return lerp(keys[i], keys[i + 1], easeInOut(u - i));
}
const DX = 148.544, DY = 70.21; // drop tip, where it hangs from the tap
function setDrop(tx, ty, sx, sy, op, clipY) {
  dropG.setAttribute('transform', `translate(${tx} ${ty}) translate(${DX} ${DY}) scale(${sx} ${sy}) translate(${-DX} ${-DY})`);
  dropG.setAttribute('opacity', op);
  dropClipRect.setAttribute('height', clipY);   // the drop is hidden below the water surface while it falls in
}
function setLogo(t) {
  let S = S_REST, tilt = 0, drift = 0;
  if (t >= 0 && pass !== 'reduced') {
    S = ringLevel(t); tilt = ringTilt(t);
    drift = pass === 'full' ? 26 * clamp(t / 1280) : 26 * clamp(t / 640);
  }
  const wet = S < S_REST - 0.01;
  lw.style.display = wet ? '' : 'none';
  if (wet) {
    lwTilt.setAttribute('transform', `rotate(${tilt.toFixed(4)} 163.3 65)`);
    lwLevel.setAttribute('transform', `translate(${(drift - 26).toFixed(4)} ${S.toFixed(4)})`);
  }
  // drop
  if (t < 0 || pass === 'reduced') return setDrop(0, 0, 1, 1, 1, 200);
  if (pass === 'full') {
    if (t < 280) { const e = inQuad(t / 280); return setDrop(0, 34 * e, 1 - 0.2 * e, 1 + 0.4 * e, 1, S); }
    if (t < 840) return setDrop(0, 0, 1, 1, 0, 200);
    if (t < 1120) { const u = (t - 840) / 280, e = outCubic(u), s = 0.4 + 0.6 * e; return setDrop(0, 0, s, s, clamp(u / 0.3), 200); }
    return setDrop(0, 0, 1, 1, 1, 200);
  }
  if (t < 240) { const b = Math.sin(Math.PI * easeInOut(t / 240)); return setDrop(0, 10 * b, 1 - 0.1 * b, 1 + 0.18 * b, 1, S); }
  return setDrop(0, 0, 1, 1, 1, 200);
}

// ---------- frame(T): everything from T alone ----------
let hdrSrc = '';
function frame(Tms) {
  const V = VIEWS[view], t = Tms - HOLD, oldIm = IMG[V.old].im, newIm = IMG[V.neu].im;
  ctx.setTransform(k, 0, 0, k, 0, 0); ctx.globalAlpha = 1; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(oldIm, 0, 0, V.W, V.H);
  let reveal = t >= 0 ? V.H : 0;   // how far down the new page is uncovered (for a bar that arrives with it)
  if (t >= 0) {
    if (pass === 'full') {
      if (t < BAND_GONE) {
        const h = 0.14 * V.H, a = 8, Y = lerp(-(h + a), V.H, easeTide(t / BAND_GONE)), center = Y + a + h / 2;
        reveal = clamp(center, 0, V.H);
        if (center > 0) { ctx.save(); ctx.beginPath(); ctx.rect(0, 0, V.W, center); ctx.clip(); ctx.drawImage(newIm, 0, 0, V.W, V.H); ctx.restore(); }
        drawBand(Y, h, a, 96 * (t / PASSES.full.dur), V.W);
      } else ctx.drawImage(newIm, 0, 0, V.W, V.H);
    } else {
      const P = PASSES[pass];
      ctx.globalAlpha = (pass === 'short' ? easeCssInOut : easeCss)(t / P.dur); ctx.drawImage(newIm, 0, 0, V.W, V.H); ctx.globalAlpha = 1;
      if (t < P.dur) reveal = 0;   // a bar new to this page dissolves in with the page on the canvas
    }
  }
  // header: the new page's live copy sits above everything from t = 0.
  // Bottom bar: if the old page showed it, it stays above the water from t = 0. If the old page hid it,
  // it is uncovered with the new page behind the band's center line and sits above the band's tail from then on.
  const src = t >= 0 ? V.neu : V.old;
  if (src !== hdrSrc) { hdr.style.backgroundImage = `url(${src})`; hdrSrc = src; }
  let barShown = 0;
  if (V.bar && t >= 0) barShown = V.barOnOld ? V.bar.h : clamp(reveal - V.bar.y, 0, V.bar.h);
  bar.style.display = barShown > 0 ? 'block' : 'none';
  if (barShown > 0) bar.style.clipPath = barShown < V.bar.h ? `inset(0 0 ${(V.bar.h - barShown).toFixed(2)}px 0)` : '';
  setLogo(t);
  ui(Tms, t);
}

// ---------- transport ----------
function buildTrack() {
  const P = PASSES[pass], tot = total();
  ticksEl.textContent = '';
  holdEl.style.width = (HOLD / tot * 100) + '%';
  P.ticks.forEach((tk, i) => {
    const x = (HOLD + tk) / tot * 100;
    const d = document.createElement('div'); d.className = 'tick' + (tk === 0 ? ' zero' : ''); d.style.left = x + '%'; ticksEl.appendChild(d);
    const l = document.createElement('div'); l.className = 'tlab r' + (i % 2); l.style.left = x + '%'; l.textContent = tk; l.title = 'Jump to ' + tk + ' ms';
    l.addEventListener('pointerdown', e => { e.stopPropagation(); pause(); seek(HOLD + tk); });
    ticksEl.appendChild(l);
  });
  const h = document.createElement('div'); h.className = 'tlab r0'; h.style.left = '0'; h.style.transform = 'none'; h.textContent = 'old page'; ticksEl.appendChild(h);
  track.setAttribute('aria-valuemax', tot);
  beatsEl.textContent = '';
  for (const [a, b, txt] of P.beats) {
    const d = document.createElement('div'); d.dataset.a = a; d.dataset.b = b;
    d.innerHTML = `<b>${a === b ? 'at ' + a : a + ' to ' + b} ms</b> ${txt}`;
    beatsEl.appendChild(d);
  }
}
function ui(Tms, t) {
  const tot = total(), x = Tms / tot * 100;
  fill.style.left = (HOLD / tot * 100) + '%'; fill.style.width = Math.max(0, x - HOLD / tot * 100) + '%';
  head.style.left = x + '%';
  readout.textContent = (t < 0 ? 'old page, ' + Math.round(t) : Math.round(t)) + ' ms';
  track.setAttribute('aria-valuenow', Math.round(Tms));
  for (const d of beatsEl.children) { const a = +d.dataset.a, b = +d.dataset.b; d.classList.toggle('on', a === b ? Math.abs(t - a) < 25 : t >= a && t <= b); }
}
const qt = x => Math.round(x * 1000) / 1000;
function seek(x) { T = qt(clamp(x, 0, total())); frame(T); }
function play() { if (T >= total()) T = 0; playing = true; last = performance.now(); playBtn.textContent = 'Pause'; }
function pause() { playing = false; playBtn.textContent = 'Play'; }
function replay() { T = 0; frame(0); play(); }
function setPressed(sel, attr, val) { document.querySelectorAll(sel).forEach(b => b.setAttribute('aria-pressed', String(b.dataset[attr] === val))); }
function set(o = {}) {
  if (o.view) view = o.view; if (o.pass) pass = o.pass;
  setPressed('[data-view]', 'view', view); setPressed('[data-pass]', 'pass', pass);
  buildTrack(); layout();
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { set({ view: b.dataset.view }); replay(); });
document.querySelectorAll('[data-pass]').forEach(b => b.onclick = () => { set({ pass: b.dataset.pass }); replay(); });
playBtn.onclick = () => playing ? pause() : play();
$('replay').onclick = replay;
slowBtn.onclick = () => { rate = rate === 1 ? 0.25 : 1; slowBtn.setAttribute('aria-pressed', String(rate !== 1)); };
function scrubAt(e) { const r = track.getBoundingClientRect(); seek(clamp((e.clientX - r.left) / r.width) * total()); }
track.addEventListener('pointerdown', e => { pause(); track.setPointerCapture(e.pointerId); scrubAt(e); });
track.addEventListener('pointermove', e => { if (track.hasPointerCapture(e.pointerId)) scrubAt(e); });
addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target.tagName !== 'BUTTON') { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); pause(); seek(T + (e.key === 'ArrowRight' ? 10 : -10)); }
});
addEventListener('resize', layout);

// frame timing log for verification scripts (rAF timestamps while playing, and frame() cost)
const stats = { stamps: [], cost: [] };
function loop(now) {
  if (playing) {
    T = qt(T + (now - last) * rate);
    if (T >= total()) { T = total(); pause(); }
    const c0 = performance.now(); frame(T); stats.cost.push(performance.now() - c0);
    stats.stamps.push(now); if (stats.stamps.length > 4000) { stats.stamps.splice(0, 2000); stats.cost.splice(0, 2000); }
  }
  last = now;
  requestAnimationFrame(loop);
}

window.__anim = {
  ready, stats,
  seek(x) { pause(); seek(x); }, seekTransition(t) { pause(); seek(HOLD + t); },
  pause, play, replay, set, get T() { return T; }, get total() { return total(); }, HOLD,
  setRate(r) { rate = r; slowBtn.setAttribute('aria-pressed', String(r !== 1)); },
};

ready.then(() => {
  loaded = true;
  set({});
  if (qs.has('t')) { seek(HOLD + Number(qs.get('t'))); pause(); }
  else if (qs.has('paused')) { seek(0); pause(); }
  else replay();   // default: autoplay once, starting with the 600 ms hold on the old page
  requestAnimationFrame(loop);
}).catch(err => { document.body.insertAdjacentHTML('afterbegin', '<p>Could not load the screenshots in animatic-assets: ' + err + '</p>'); });
</script>
</body>
</html>
